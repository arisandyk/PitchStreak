name: iOS CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Show available simulators
        run: xcrun simctl list devices available

      - name: Resolve Swift Package dependencies
        run: xcodebuild -resolvePackageDependencies -project PitchStreak.xcodeproj -scheme PitchStreak

      - name: Build
        run: |
          xcodebuild build \
            -project PitchStreak.xcodeproj \
            -scheme PitchStreak \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project PitchStreak.xcodeproj \
            -scheme PitchStreak \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -enableCodeCoverage YES \
